name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "registry/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # libcairo2 is a runtime dependency of the mkdocs-material `social` plugin
      # (social preview card generation) and isn't preinstalled on ubuntu-latest.
      - name: Install system dependencies for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - run: pip install -r requirements.txt

      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Render registry/*.yaml entries as the docs catalog page, so the deployed
      # site always reflects the registry even if the committed page went stale.
      - name: Regenerate registry catalog page
        run: python scripts/build_registry_page.py

      # Rebuild the campaign-index data from the campaign pages themselves,
      # so the "All campaigns" table can never go stale on the deployed site.
      - name: Regenerate campaign index data
        run: python scripts/build_campaign_index.py

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
