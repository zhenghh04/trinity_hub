site_name: Trinity Hub
site_description: >-
  How to use Trinity — the multi-tenant agentic HPC workspace — and how to extend
  it with your own agents and skills.
site_url: https://zhenghh04.github.io/trinity_hub/
site_author: ALCF / Argonne National Laboratory

repo_url: https://github.com/zhenghh04/trinity_hub
repo_name: zhenghh04/trinity_hub
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#7c6af7"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/software-dashboard.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhenghh04/trinity_hub
    - icon: material/web
      link: https://www.alcf.anl.gov
  generator: false

copyright: >-
  Trinity is developed at ALCF / Argonne National Laboratory.

