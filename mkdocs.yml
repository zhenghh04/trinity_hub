      - The chat interface: using-trinity/chat.md
      - Running HPC jobs: using-trinity/running-jobs.md
      - Files & projects: using-trinity/files-and-projects.md
      - Settings: using-trinity/settings.md
      - Agents & rooms: using-trinity/agents-and-rooms.md
      - API access: using-trinity/api-access.md
